<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portal Rescue</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<style>
body{margin:0;background:#1a1612;color:#f3e9d2;font:18px/1.5 -apple-system,Helvetica,sans-serif;padding:24px 16px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:26px;color:#f5d060;margin:0 0 8px}
.n{font-size:56px;color:#f5d060;font-weight:700;margin:12px 0 0}
ul{padding-left:20px}
button{width:100%;font-size:22px;padding:18px;border:0;border-radius:14px;background:#f5d060;color:#1a1612;font-weight:700;margin-top:16px}
button:disabled{opacity:.5}
#msg{margin-top:16px;font-size:20px}
.small{font-size:14px;opacity:.7}
</style></head><body><div class="wrap">
<h1>Portal rescue</h1>
<div>Check-ins saved on this device:</div>
<div class="n" id="count">…</div>
<ul id="list"></ul>
<button id="send">Send to MAT</button>
<div id="msg"></div>
<p class="small">This page only reads what this iPad saved. It changes nothing.</p>
</div>
<script>
var raw=[], comm=[];
try{ raw=JSON.parse(localStorage.getItem('ehp_data')||'[]'); }catch(e){}
try{ comm=JSON.parse(localStorage.getItem('ehp_community')||'[]'); }catch(e){}
var today=new Date(); today.setHours(0,0,0,0);
var items=(Array.isArray(raw)?raw:[]).filter(function(x){ return x && x.time && x.time>=today.getTime(); });
document.getElementById('count').textContent=items.length;
var L=document.getElementById('list');
items.forEach(function(x){ var li=document.createElement('li'); li.textContent=(x.name||'?')+' · '+(x.type||'')+' · '+new Date(x.time).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); L.appendChild(li); });
var dev=localStorage.getItem('ehp_rescue_dev'); if(!dev){ dev='D'+Math.random().toString(36).slice(2,7); try{localStorage.setItem('ehp_rescue_dev',dev);}catch(e){} }
document.getElementById('send').onclick=function(){
  var b=this, m=document.getElementById('msg'); b.disabled=true; m.textContent='Sending…';
  try{
    firebase.initializeApp({databaseURL:"https://earth-harmony-portal-4baeb-default-rtdb.firebaseio.com",projectId:"earth-harmony-portal-4baeb"});
    var d=new Date(), key='S'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
    firebase.database().ref('recovered/'+key+'/'+dev).set({sent:Date.now(), ua:navigator.userAgent, items:items, allCount:raw.length, community:comm.slice(-40)})
      .then(function(){ m.textContent='✓ Sent '+items.length+'. MAT has it.'; })
      .catch(function(e){ m.textContent='Did not send: '+e.message+'. Check Wi-Fi and tap again.'; b.disabled=false; });
    setTimeout(function(){ if(m.textContent==='Sending…'){ m.textContent='Still waiting. Is Wi-Fi on? Tap again.'; b.disabled=false; } },12000);
  }catch(e){ m.textContent='Error: '+e.message; b.disabled=false; }
};
</script></body></html>
